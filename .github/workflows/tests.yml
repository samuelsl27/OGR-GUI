# SPDX-License-Identifier: AGPL-3.0-or-later
name: tests

on:
  push:
    branches: [main, "dev/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test suite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the programs ship on: the pieces here are
        # what a window looks like and how it behaves, and Qt is not the
        # same library on each. 3.11 is the floor pyproject.toml declares
        # (OGR Slip2D's 3.11 job was the only one failing for five releases
        # on a PEP 701 f-string), 3.13 the ceiling the suite tests.
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ["3.11", "3.12", "3.13"]

    steps:
      # v7: the first majors on `node24` were v5/v6, and v7 is what the
      # suite vetted so the jump is not due again within the year
      # (tests/test_ci_actions_v010.py holds the floor).
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system libraries for Qt
        # The list of OGR Slip2D's CI: PySide6 needs them even off screen,
        # because the tests build real widgets.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-cursor0

      - name: Install the package and the runner of its tests
        # The [test] extra brings ogr-core from the tag it pins: the suite's
        # runner and its leak check. ogr_ui itself does not import it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the test suite
        # Off screen on every platform: the tests build real widgets that
        # never reach a display. The runner exits non-zero when anything
        # fails or leaks.
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: python tests/_runner.py

  licence:
    name: Licence consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check SPDX headers and packaging metadata
        # Runs standalone: it only reads files, so it needs no dependencies
        # and gives fast feedback on a licence slip. The block scalar (`|`)
        # is not cosmetic: with a plain scalar YAML folds every line into
        # one and the heredoc never meets its `PY` terminator.
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tests")
          import test_license_v010 as t
          failed = 0
          for name in dir(t):
              if not name.startswith("Test"):
                  continue
              inst = getattr(t, name)()
              for m in dir(inst):
                  if m.startswith("test_"):
                      try:
                          getattr(inst, m)()
                      except Exception as exc:
                          failed += 1
                          print(f"FAIL {name}.{m}: {exc}")
          print("licence checks failed:", failed)
          sys.exit(1 if failed else 0)
          PY
